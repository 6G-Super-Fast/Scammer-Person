<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=985">
    <title>Fraud Alert List</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0f1319; color: #c9d1d9; min-height: 100vh; padding: 25px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .fraud-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; align-items: start; }
        
        .fraud-card { 
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .fraud-card:hover { transform: translateY(-3px); border-color: #00d4ff; }
        
        .card-header { 
            padding: 12px 18px; 
            background: #1c2128; 
            border-bottom: 1px solid #30363d; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-weight: 700; 
            font-size: 16px;
            color: #ff5555; 
        }
        .s-no { background: #da3633; color: white; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; }
        
        .card-img-container { 
            width: 100%; 
            background: #161b22; 
            overflow: hidden; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .card-img-container img { 
            width: 100%; 
            height: auto; 
            display: block;
            transition: transform 0.3s; 
        }
        .card-img-container:hover img { transform: scale(1.02); }
        
        .card-body { padding: 15px; background: #161b22; }
        
        .whatsapp-btn { 
            display: flex; align-items: center; justify-content: center; gap: 8px; 
            background: #2ea043; color: white; padding: 12px; 
            border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px;
            transition: background 0.2s; box-shadow: 0 4px 12px rgba(46, 160, 67, 0.2);
            width: 100%;
        }
        .whatsapp-btn:hover { background: #238636; }

        /* Multi-Number Grid Strip Styles */
        .whatsapp-grid-container {
            background: #2ea043;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(46, 160, 67, 0.2);
            display: flex;
            flex-direction: column;
        }
        .whatsapp-grid-title {
            color: white;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            padding: 4px 0 2px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(0,0,0,0.15);
        }
        .whatsapp-grid-buttons {
            display: flex;
            width: 100%;
        }
        .wa-grid-btn {
            flex: 1;
            color: white;
            padding: 10px 0;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            text-align: center;
            border-right: 1px solid rgba(255,255,255,0.3);
            transition: background 0.2s;
        }
        .wa-grid-btn:last-child { border-right: none; }
        .wa-grid-btn:hover { background: rgba(0,0,0,0.2); }
        
        .loading, .no-data { text-align: center; grid-column: 1 / -1; padding: 50px; color: #8b949e; font-size: 15px; }
        
        /* Modal for Image Preview */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; padding: 20px; }
        .modal img { max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 0 25px rgba(0,0,0,0.8); }
        .modal-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 35px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div id="fraudGrid" class="fraud-grid">
            <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading entries from server...</div>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="imgModal" class="modal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <img id="modalImg" src="">
    </div>

    <script>
        const TOKEN_PART_1 = "ghp_ib4h4kWYgpi9tp7N"; 
        const TOKEN_PART_2 = "WAmVKpx0IU4Gtk18s8tG"; 
        const GIT_TOKEN = TOKEN_PART_1 + TOKEN_PART_2; 
        const myRepo = "6G-Super-Fast/Scammer-Person";

        async function loadData() {
            let fraudData = [];

            try {
                const response = await fetch(`https://api.github.com/repos/${myRepo}/contents/data.json?t=` + new Date().getTime(), {
                    headers: { 'Authorization': `token ${GIT_TOKEN}` }
                });
                if (response.ok) {
                    const fileData = await response.json();
                    const decodedData = decodeURIComponent(escape(atob(fileData.content)));
                    fraudData = JSON.parse(decodedData);
                }
            } catch (e) {
                console.log("Internal connection fallback");
            }

            renderCards(fraudData);
        }

        function renderCards(data) {
            const grid = document.getElementById('fraudGrid');
            if (!data || data.length === 0) {
                grid.innerHTML = `<div class="no-data">No records found. Please add entries from Admin Panel.</div>`;
                return;
            }

            grid.innerHTML = data.map((item, index) => {
                let sNo = item.s_no || (index + 1);
                let actionHtml = "";

                // Check if item.whatsapp is an array or a single string (for backward compatibility)
                if (Array.isArray(item.whatsapp) && item.whatsapp.length > 1) {
                    let buttonsHtml = "";
                    item.whatsapp.forEach((link, idx) => {
                        buttonsHtml += `<a href="${link}" target="_blank" class="wa-grid-btn" title="Number ${idx + 1}">${idx + 1}</a>`;
                    });
                    actionHtml = `
                        <div class="whatsapp-grid-container">
                            <div class="whatsapp-grid-title"><i class="fa-brands fa-whatsapp"></i> WhatsApp Numbers (${item.whatsapp.length})</div>
                            <div class="whatsapp-grid-buttons">${buttonsHtml}</div>
                        </div>
                    `;
                } else {
                    let singleLink = Array.isArray(item.whatsapp) ? item.whatsapp[0] : item.whatsapp;
                    actionHtml = `
                        <a href="${singleLink}" target="_blank" class="whatsapp-btn">
                            <i class="fa-brands fa-whatsapp fa-lg"></i> Open WhatsApp Link
                        </a>
                    `;
                }

                return `
                    <div class="fraud-card">
                        <div class="card-header">
                            <span>Fraud Alert ⚠️</span>
                            <span class="s-no"># ${sNo}</span>
                        </div>
                        <div class="card-img-container" onclick="openModal('${item.image}')">
                            <img src="${item.image}" alt="Screenshot" onerror="this.src='https://via.placeholder.com/300x220?text=Image+Not+Found'">
                        </div>
                        <div class="card-body">
                            ${actionHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openModal(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imgModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imgModal').style.display = 'none';
        }

        window.onload = loadData;
    </script>
</body>
</html>
