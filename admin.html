<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro Admin Dashboard ⚡</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: #0f1319; 
            background-image: radial-gradient(circle at top right, #1a1a2e, #0f1319);
            color: #c9d1d9; 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .admin-box { 
            background: #161b22; 
            padding: 40px 30px; 
            border-radius: 16px; 
            width: 100%;
            max-width: 550px; 
            border: 1px solid #00d4ff; 
            text-align: center; 
            box-shadow: 0 15px 35px rgba(0, 212, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .admin-box::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #00d4ff, #00ea77, #00d4ff);
        }

        h2, h3 { color: #fff; font-weight: 700; letter-spacing: 1px; margin-bottom: 5px; }
        h2 i, h3 i { color: #00ea77; margin-right: 8px; }
        .subtitle { color: #8b949e; font-size: 13px; font-weight: 500; margin-bottom: 25px; font-family: 'Inter', sans-serif; }

        .input-pro { 
            width: 100%; padding: 15px 20px; margin-bottom: 15px; 
            background: #010409; color: #fff; 
            border: 1px solid #30363d; border-radius: 10px; 
            font-size: 14px; font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }
        .input-pro::placeholder { color: #6e7681; }
        .input-pro:focus { 
            border-color: #00d4ff; 
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.2); 
            outline: none; 
        }

        .btn-pro { 
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 15px; margin-bottom: 15px;
            border: none; border-radius: 10px; 
            cursor: pointer; font-weight: 700; font-size: 15px; 
            transition: all 0.3s ease; text-transform: uppercase;
            font-family: 'Poppins', sans-serif; letter-spacing: 0.5px;
        }
        
        .btn-green { background: #00ea77; color: #000; box-shadow: 0 4px 15px rgba(0, 234, 119, 0.2); }
        .btn-green:hover { background: #00ff88; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 234, 119, 0.4); }
        
        .btn-yellow { background: #d29922; color: #fff; box-shadow: 0 4px 15px rgba(210, 153, 34, 0.2); }
        .btn-yellow:hover { background: #e3b341; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(210, 153, 34, 0.4); }
        
        .btn-purple { background: #8957e5; color: #fff; box-shadow: 0 4px 15px rgba(137, 87, 229, 0.2); }
        .btn-purple:hover { background: #9a6bfa; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(137, 87, 229, 0.4); }
        
        .btn-blue { background: #1f6feb; color: #fff; box-shadow: 0 4px 15px rgba(31, 111, 235, 0.2); margin-bottom: 0;}
        .btn-blue:hover { background: #388bfd; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(31, 111, 235, 0.4); }

        .action-btns button {
            padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer;
            font-weight: 600; font-size: 12px; transition: 0.3s; color: #fff;
        }
        .btn-edit { background: #9e6a03; margin-right: 8px; }
        .btn-edit:hover { background: #d29922; }
        .btn-delete { background: #da3633; }
        .btn-delete:hover { background: #f85149; }

        .list-item { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 12px; padding: 15px; 
            background: #0d1117; border-radius: 10px; border: 1px solid #30363d; 
            text-align: left; cursor: grab; transition: 0.3s ease;
        }
        .list-item:hover { border-color: #8b949e; background: #161b22; }
        .list-item:active { cursor: grabbing; }
        .list-item.dragging { opacity: 0.4; background: #21262d; border: 1px dashed #00ea77; }
        .list-item.drag-over { border-top: 3px solid #00d4ff; transform: scale(1.02); }
        .drag-icon { margin-right: 15px; color: #8b949e; font-size: 16px; display: flex; align-items: center; }
        .icon-preview { width: 35px; height: 35px; object-fit: contain; margin-right: 12px; border-radius: 6px; background: #fff; padding: 2px;}

        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); backdrop-filter: blur(5px); align-items: center; justify-content: center; }
        .modal-content { background: #161b22; padding: 30px; border-radius: 16px; border: 1px solid #00d4ff; width: 90%; max-width: 650px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 15px 50px rgba(0,0,0,0.6); animation: popIn 0.3s ease-out; }
        .full-page-modal { max-width: 95%; height: 95vh; width: 1200px; }
        
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; margin-bottom: 20px; }
        .modal-header h3 { margin: 0; color: #fff; font-size: 22px; display: flex; align-items: center; gap: 10px;}
        .close-btn { color: #da3633; font-size: 28px; font-weight: bold; cursor: pointer; background: none; border: none; transition: 0.3s; }
        .close-btn:hover { color: #ff4757; transform: rotate(90deg); }
        
        #projectList { overflow-y: auto; padding-right: 10px; flex-grow: 1; }
        ::-webkit-scrollbar { width: 8px; height: 8px;}
        ::-webkit-scrollbar-track { background: #010409; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b949e; }
    </style>
</head>
<body>

    <div class="admin-box" id="loginSection">
        <h2><i class="fa-solid fa-shield-halved"></i> Security Portal</h2>
        <p class="subtitle">Enter the Admin Dashboard to manage 6G SUPER-FAST</p>
        
        <button class="btn-pro btn-green" style="margin-top: 15px;" onclick="loadData()">
            <i class="fa-solid fa-right-to-bracket"></i> ENTER ADMIN PANEL
        </button>
    </div>

    <div class="admin-box" id="editorSection" style="display:none; padding-top: 30px;">
        <h3 id="formTitle"><i class="fa-solid fa-fire"></i> Add New Site</h3>
        <p class="subtitle" style="margin-bottom: 20px;">Fill details to add a new tool card to the grid.</p>
        
        <input type="text" id="pName" class="input-pro" placeholder="Tool Ka Naam">
        <input type="url" id="pLink" class="input-pro" placeholder="Tool URL Link (https://...)">
        <input type="url" id="pIcon" class="input-pro" placeholder="Icon Image URL (Optional)">
        
        <button id="actionBtn" class="btn-pro btn-green" onclick="processTool()">
            <i class="fa-solid fa-plus"></i> ADD TO LIST
        </button>
        
        <hr style="border: none; border-top: 1px solid #30363d; margin: 25px 0;">

        <button class="btn-pro btn-yellow" onclick="openModal()">
            <i class="fa-solid fa-list-check"></i> VIEW SAVED TOOLS
        </button>
        
        <button class="btn-pro btn-purple" onclick="openUserModal()">
            <i class="fa-solid fa-users"></i> VIEW USER LIST
        </button>
        
        <button class="btn-pro btn-blue" onclick="saveToGitHub()">
            <i class="fa-solid fa-cloud-arrow-up"></i> UPLOAD TO GITHUB
        </button>
        
        <button class="btn-pro" style="background: #da3633; color: #fff; margin-top: 15px;" onclick="logoutAdmin()">
            <i class="fa-solid fa-right-from-bracket"></i> LOGOUT
        </button>
    </div>

    <div id="listModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-bars-staggered"></i> ALL TOOLS LIST</h3>
                <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="subtitle" style="text-align: left; margin-top:-10px;">💡 Drag & Drop to reorder the tools sequence.</p>
            <div id="projectList"></div>
        </div>
    </div>

    <div id="userListModal" class="modal">
        <div class="modal-content full-page-modal">
            <div class="modal-header">
                <h3><i class="fa-solid fa-users-gear"></i> REGISTERED USERS DATABASE</h3>
                <button class="close-btn" onclick="closeUserModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th width="5%">S.NO</th>
                            <th width="20%">NAME</th>
                            <th width="15%">MOBILE NO</th>
                            <th width="30%">EMAIL ID</th>
                            <th width="15%">PASSWORD</th>
                            <th width="15%">REG DATE</th>
                        </tr>
                    </thead>
                    <tbody id="userListBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const TOKEN_PART_1 = "ghp_ib4h4kWYgpi9tp7N"; 
        const TOKEN_PART_2 = "WAmVKpx0IU4Gtk18s8tG"; 
        const GIT_TOKEN = TOKEN_PART_1 + TOKEN_PART_2; 
        
        const myRepo = "6G-SUPER-FAST/Login-Penel";[cite: 1]
        
        let toolsArray = [];
        let fileSha = "";
        let editIndex = null; 
        let dragStartIndex = null; 

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('isAdminLoggedIn') === 'true') {
                toolsArray = JSON.parse(localStorage.getItem('cachedToolsArray') || '[]');
                fileSha = localStorage.getItem('cachedFileSha') || '';
                
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('editorSection').style.display = 'block';
                
                if(toolsArray.length === 0) {
                    loadDataSilent();
                } else {
                    renderList();
                }
            }
        });

        async function loadDataSilent() {
            try {
                const response = await fetch(`https://api.github.com/repos/${myRepo}/contents/tools.json`, {
                    headers: { 'Authorization': `token ${GIT_TOKEN}` }
                });
                if(response.ok) {
                    const data = await response.json();
                    fileSha = data.sha;
                    const decodedData = decodeURIComponent(escape(atob(data.content)));
                    toolsArray = JSON.parse(decodedData);
                    localStorage.setItem('cachedFileSha', fileSha);
                    localStorage.setItem('cachedToolsArray', JSON.stringify(toolsArray));
                    renderList();
                }
            } catch (error) {
                console.log("Background sync failed");
            }
        }

        async function loadData() {
            const loginBtn = document.querySelector('#loginSection .btn-green');
            loginBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> LOADING DATA...";

            try {
                const response = await fetch(`https://api.github.com/repos/${myRepo}/contents/tools.json`, {
                    headers: { 'Authorization': `token ${GIT_TOKEN}` }
                });
                
                if(!response.ok) throw new Error("Key galat hai!");
                
                const data = await response.json();
                fileSha = data.sha;
                const decodedData = decodeURIComponent(escape(atob(data.content)));
                toolsArray = JSON.parse(decodedData);
                
                localStorage.setItem('isAdminLoggedIn', 'true');
                localStorage.setItem('cachedFileSha', fileSha);
                localStorage.setItem('cachedToolsArray', JSON.stringify(toolsArray));
                
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('editorSection').style.display = 'block';
                renderList();
            } catch (error) {
                alert("Error! Token check karo ya internet connection dekho.");
                loginBtn.innerHTML = "<i class='fa-solid fa-right-to-bracket'></i> ENTER ADMIN PANEL";
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('isAdminLoggedIn');
            localStorage.removeItem('cachedFileSha');
            localStorage.removeItem('cachedToolsArray');
            document.getElementById('editorSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
            document.querySelector('#loginSection .btn-green').innerHTML = "<i class='fa-solid fa-right-to-bracket'></i> ENTER ADMIN PANEL";
        }

        function renderList() {
            const list = document.getElementById('projectList');
            list.innerHTML = "";
            let sNo = 1;
            toolsArray.forEach((tool, index) => {
                if(!tool.name) return; 

                let iconPreview = '';
                if(tool.icon && (tool.icon.startsWith('http') || tool.icon.startsWith('data:'))) {
                    iconPreview = `<img src="${tool.icon}" class="icon-preview" alt="icon">`;
                } else {
                    iconPreview = `<span style="font-size: 22px; margin-right: 15px; color:#00ea77;"><i class="fa-solid fa-bolt"></i></span>`;
                }

                list.innerHTML += `
                    <div class="list-item" draggable="true" data-index="${index}">
                        <div style="display: flex; align-items: center; flex: 1; padding-right: 15px;">
                            <span class="drag-icon"><i class="fa-solid fa-grip-vertical"></i></span>
                            ${iconPreview}
                            <span style="font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif;">
                                ${sNo++}. ${tool.name.replace(' ⚡', '')}
                            </span>
                        </div>
                        <div class="action-btns">
                            <button class="btn-edit" onclick="editTool(${index})"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-delete" onclick="deleteTool(${index})"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>`;
            });
            addDragAndDropListeners();
        }

        function addDragAndDropListeners() {
            const draggables = document.querySelectorAll('.list-item');
            draggables.forEach(draggable => {
                draggable.addEventListener('dragstart', function(e) { dragStartIndex = +this.getAttribute('data-index'); this.classList.add('dragging'); });
                draggable.addEventListener('dragover', function(e) { e.preventDefault(); });
                draggable.addEventListener('dragenter', function(e) { e.preventDefault(); this.classList.add('drag-over'); });
                draggable.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
                draggable.addEventListener('drop', function() { this.classList.remove('drag-over'); const dragEndIndex = +this.getAttribute('data-index'); swapItems(dragStartIndex, dragEndIndex); });
                draggable.addEventListener('dragend', function() { this.classList.remove('dragging'); });
            });
        }

        function swapItems(fromIndex, toIndex) {
            const itemToMove = toolsArray.splice(fromIndex, 1)[0];
            toolsArray.splice(toIndex, 0, itemToMove);
            localStorage.setItem('cachedToolsArray', JSON.stringify(toolsArray));
            renderList(); 
        }

        function processTool() {
            const name = document.getElementById('pName').value.trim();
            const link = document.getElementById('pLink').value.trim();
            const icon = document.getElementById('pIcon').value.trim();
            
            if(!name || !link) { return alert("Tool ka Naam aur Link dono daalna zaroori hai!"); }

            if(editIndex === null) {
                toolsArray.push({name, url: link, icon});
            } else {
                toolsArray[editIndex] = {name, url: link, icon};
                editIndex = null;
                document.getElementById('formTitle').innerHTML = "<i class='fa-solid fa-fire'></i> Add New Site";
                document.getElementById('actionBtn').innerHTML = "<i class='fa-solid fa-plus'></i> ADD TO LIST";
                document.getElementById('actionBtn').className = "btn-pro btn-green";
            }

            document.getElementById('pName').value = "";
            document.getElementById('pLink').value = "";
            document.getElementById('pIcon').value = "";
            localStorage.setItem('cachedToolsArray', JSON.stringify(toolsArray));
            renderList();
            closeModal(); 
        }

        function editTool(index) {
            editIndex = index;
            document.getElementById('pName').value = toolsArray[index].name || "";
            document.getElementById('pLink').value = toolsArray[index].url || "";
            document.getElementById('pIcon').value = toolsArray[index].icon || "";
            
            document.getElementById('formTitle').innerHTML = "<i class='fa-solid fa-pen-to-square'></i> Edit Tool";
            document.getElementById('actionBtn').innerHTML = "<i class='fa-solid fa-check-double'></i> UPDATE TOOL";
            document.getElementById('actionBtn').className = "btn-pro btn-yellow";
            closeModal(); 
        }

        function deleteTool(index) {
            if(confirm("Pakka delete karna hai ye tool?")) {
                toolsArray.splice(index, 1);
                if(editIndex === index) {
                    editIndex = null;
                    document.getElementById('pName').value = ""; document.getElementById('pLink').value = ""; document.getElementById('pIcon').value = "";
                    document.getElementById('formTitle').innerHTML = "<i class='fa-solid fa-fire'></i> Add New Site";
                    document.getElementById('actionBtn').innerHTML = "<i class='fa-solid fa-plus'></i> ADD TO LIST";
                    document.getElementById('actionBtn').className = "btn-pro btn-green";
                }
                localStorage.setItem('cachedToolsArray', JSON.stringify(toolsArray));
                renderList();
            }
        }

        async function saveToGitHub() {
            const updatedJson = JSON.stringify(toolsArray, null, 2);
            const encodedContent = btoa(unescape(encodeURIComponent(updatedJson)));
            const uploadBtn = document.querySelector('.btn-blue');
            
            uploadBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> SAVING TO GITHUB...";
            uploadBtn.style.background = "#d29922";

            try {
                const response = await fetch(`https://api.github.com/repos/${myRepo}/contents/tools.json`, {[cite: 1]
                    method: 'PUT',
                    headers: { 'Authorization': `token ${GIT_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "Updated tools via Control Room", content: encodedContent, sha: fileSha })
                });

                if(response.ok) {
                    const data = await response.json();
                    fileSha = data.content.sha;
                    localStorage.setItem('cachedFileSha', fileSha);
                    
                    uploadBtn.innerHTML = "<i class='fa-solid fa-circle-check'></i> UPLOAD DONE ✅";
                    uploadBtn.style.background = "#00ea77";
                    uploadBtn.style.color = "#000";

                    setTimeout(() => {
                        uploadBtn.innerHTML = "<i class='fa-solid fa-cloud-arrow-up'></i> UPLOAD TO GITHUB";
                        uploadBtn.style.background = "#1f6feb";
                        uploadBtn.style.color = "#fff";
                    }, 3000);

                } else { throw new Error("Save error"); }
            } catch (error) {
                uploadBtn.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> FAILED ❌";
                uploadBtn.style.background = "#da3633";
                setTimeout(() => {
                    uploadBtn.innerHTML = "<i class='fa-solid fa-cloud-arrow-up'></i> UPLOAD TO GITHUB";
                    uploadBtn.style.background = "#1f6feb";
                }, 3000);
            }
        }

        function openModal() { document.getElementById('listModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('listModal').style.display = 'none'; }
        
        function openUserModal() { document.getElementById('userListModal').style.display = 'flex'; loadUserList(); }
        function closeUserModal() { document.getElementById('userListModal').style.display = 'none'; }

        function loadUserList() {
            const tbody = document.getElementById('userListBody');
            tbody.innerHTML = '';
            let count = 1;

            toolsArray.forEach(data => {
                if(data.mobile && data.password) {
                    const dateStr = data.date || 'N/A';
                    const emailStr = data.email || 'N/A';
                    const nameStr = data.userName || 'N/A';
                    tbody.innerHTML += `
                        <tr>
                            <td>${count++}</td>
                            <td style="color: #fff; font-weight: 500;">${nameStr}</td>
                            <td class="data-highlight"><i class="fa-solid fa-phone" style="font-size:11px; margin-right:5px; color:#8b949e;"></i> ${data.mobile}</td>
                            <td>${emailStr}</td>
                            <td class="pass-highlight">${data.password}</td>
                            <td style="color: #8b949e; font-size:13px;"><i class="fa-regular fa-calendar-days" style="margin-right:4px;"></i> ${dateStr}</td>
                        </tr>
                    `;
                }
            });

            if(count === 1) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#8b949e; padding:40px; font-size: 16px;"><i class="fa-solid fa-folder-open" style="font-size: 24px; display:block; margin-bottom:10px;"></i> No users registered yet.</td></tr>';
            }
        }
    </script>
</body>
</html>
