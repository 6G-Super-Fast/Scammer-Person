<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scammer Person - Admin Dashboard ⚡</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: #0f1319; 
            background-image: radial-gradient(circle at top right, #1a1a2e, #0f1319);
            color: #c9d1d9; 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .admin-box { 
            background: #161b22; 
            padding: 40px 30px; 
            border-radius: 16px; 
            width: 100%;
            max-width: 550px; 
            border: 1px solid #00d4ff; 
            text-align: center; 
            box-shadow: 0 15px 35px rgba(0, 212, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .admin-box::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #00d4ff, #00ea77, #00d4ff);
        }

        h2, h3 { color: #fff; font-weight: 700; letter-spacing: 1px; margin-bottom: 5px; }
        h2 i, h3 i { color: #00ea77; margin-right: 8px; }
        .subtitle { color: #8b949e; font-size: 13px; font-weight: 500; margin-bottom: 25px; font-family: 'Inter', sans-serif; }

        .input-pro { 
            width: 100%; padding: 15px 20px; margin-bottom: 15px; 
            background: #010409; color: #fff; 
            border: 1px solid #30363d; border-radius: 10px; 
            font-size: 14px; font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }
        .input-pro::placeholder { color: #6e7681; }
        .input-pro:focus { 
            border-color: #00d4ff; 
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.2); 
            outline: none; 
        }

        .file-upload-box {
            position: relative;
            background: #010409;
            border: 1px dashed #30363d;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .file-upload-box:hover { border-color: #00d4ff; background: #080d16; }
        .file-upload-box input[type="file"] {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }
        .preview-img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid #00ea77; }

        .btn-pro { 
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 15px; margin-bottom: 15px;
            border: none; border-radius: 10px; 
            cursor: pointer; font-weight: 700; font-size: 15px; 
            transition: all 0.3s ease; text-transform: uppercase;
            font-family: 'Poppins', sans-serif; letter-spacing: 0.5px;
        }
        
        .btn-green { background: #00ea77; color: #000; box-shadow: 0 4px 15px rgba(0, 234, 119, 0.2); }
        .btn-green:hover { background: #00ff88; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 234, 119, 0.4); }
        
        .btn-yellow { background: #d29922; color: #fff; box-shadow: 0 4px 15px rgba(210, 153, 34, 0.2); }
        .btn-yellow:hover { background: #e3b341; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(210, 153, 34, 0.4); }
        
        .btn-blue { background: #1f6feb; color: #fff; box-shadow: 0 4px 15px rgba(31, 111, 235, 0.2); margin-bottom: 0;}
        .btn-blue:hover { background: #388bfd; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(31, 111, 235, 0.4); }

        .action-btns button {
            padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer;
            font-weight: 600; font-size: 12px; transition: 0.3s; color: #fff;
        }
        .btn-edit { background: #9e6a03; margin-right: 8px; }
        .btn-edit:hover { background: #d29922; }
        .btn-delete { background: #da3633; }
        .btn-delete:hover { background: #f85149; }

        .list-item { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 12px; padding: 15px; 
            background: #0d1117; border-radius: 10px; border: 1px solid #30363d; 
            text-align: left; transition: 0.3s ease;
        }
        .list-item:hover { border-color: #8b949e; background: #161b22; }
        .icon-preview { width: 45px; height: 45px; object-fit: cover; margin-right: 12px; border-radius: 6px; border: 1px solid #30363d;}

        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); backdrop-filter: blur(5px); align-items: center; justify-content: center; }
        .modal-content { background: #161b22; padding: 30px; border-radius: 16px; border: 1px solid #00d4ff; width: 90%; max-width: 700px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 15px 50px rgba(0,0,0,0.6); animation: popIn 0.3s ease-out; }
        
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; margin-bottom: 20px; }
        .modal-header h3 { margin: 0; color: #fff; font-size: 20px; display: flex; align-items: center; gap: 10px;}
        .close-btn { color: #da3633; font-size: 28px; font-weight: bold; cursor: pointer; background: none; border: none; transition: 0.3s; }
        .close-btn:hover { color: #ff4757; transform: rotate(90deg); }
        
        #fraudListContainer { overflow-y: auto; padding-right: 10px; flex-grow: 1; }
        ::-webkit-scrollbar { width: 8px; height: 8px;}
        ::-webkit-scrollbar-track { background: #010409; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b949e; }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div class="admin-box" id="loginSection">
        <h2><i class="fa-solid fa-shield-halved"></i> Scammer Admin Portal</h2>
        <p class="subtitle">Secure Control Room for Scammer List</p>
        
        <button class="btn-pro btn-green" style="margin-top: 15px;" onclick="loadData()">
            <i class="fa-solid fa-right-to-bracket"></i> ENTER ADMIN PANEL
        </button>
    </div>

    <!-- Main Editor Section -->
    <div class="admin-box" id="editorSection" style="display:none; padding-top: 30px;">
        <h3 id="formTitle"><i class="fa-solid fa-triangle-exclamation"></i> Add New Scammer Entry</h3>
        <p class="subtitle" style="margin-bottom: 20px;">Upload screenshot & WhatsApp link for public index.</p>
        
        <input type="text" id="sNoInput" class="input-pro" placeholder="S. No. (e.g. 1)">
        <input type="url" id="whatsappInput" class="input-pro" placeholder="WhatsApp URL (https://wa.me/...)">
        
        <!-- File Upload Box (Supports Manual + Ctrl+V Paste) -->
        <div class="file-upload-box" id="dropZone">
            <i class="fa-solid fa-cloud-arrow-up" style="font-size: 24px; color: #00d4ff; margin-bottom: 5px;"></i>
            <div id="uploadText" style="font-size: 13px; color: #8b949e;">Click to browse OR Paste Screenshot (Ctrl + V)</div>
            <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">
            <img id="imagePreview" class="preview-img" alt="Preview">
        </div>
        <input type="hidden" id="imageUrlInput">
        
        <button id="actionBtn" class="btn-pro btn-green" onclick="processFraudEntry()">
            <i class="fa-solid fa-plus"></i> ADD ENTRY
        </button>
        
        <hr style="border: none; border-top: 1px solid #30363d; margin: 25px 0;">

        <button class="btn-pro btn-yellow" onclick="openModal()">
            <i class="fa-solid fa-list-check"></i> VIEW DATA LIST & EDIT
        </button>
        
        <button class="btn-pro btn-blue" onclick="saveToGitHub()">
            <i class="fa-solid fa-cloud-arrow-up"></i> UPLOAD TO GITHUB
        </button>
        
        <button class="btn-pro" style="background: #da3633; color: #fff; margin-top: 15px;" onclick="logoutAdmin()">
            <i class="fa-solid fa-right-from-bracket"></i> LOGOUT
        </button>
    </div>

    <!-- View Data List Modal -->
    <div id="listModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-list"></i> ALL SCAMMER RECORDS LIST</h3>
                <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="fraudListContainer"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // GITHUB & TOKEN CONFIGURATION
        // ==========================================
        const TOKEN_PART_1 = "ghp_ib4h4kWYgpi9tp7N"; 
        const TOKEN_PART_2 = "WAmVKpx0IU4Gtk18s8tG"; 
        const GIT_TOKEN = TOKEN_PART_1 + TOKEN_PART_2; 
        
        const myRepo = "6G-Super-Fast/Scammer-Person"; 
        
        let fraudArray = [];
        let editIndex = null; 
        let base64Image = "";

        // Check login state on page load
        window.addEventListener('DOMContentLoaded', () => {
            // Sabse pehle local storage se load karein taaki turant data mil jaye
            fraudArray = JSON.parse(localStorage.getItem('cachedScammerArray') || '[]');

            if (localStorage.getItem('isScammerAdminLoggedIn') === 'true') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('editorSection').style.display = 'block';
                autoSuggestSNo();
                loadDataSilent();
            }

            // Global Ctrl + V Clipboard Listener for Images
            window.addEventListener('paste', (e) => {
                if(document.getElementById('editorSection').style.display === 'block') {
                    const items = e.clipboardData.items;
                    for (let i = 0; i < items.length; i++) {
                        if (items[i].type.indexOf('image') !== -1) {
                            const blob = items[i].getAsFile();
                            processImageFile(blob);
                            break;
                        }
                    }
                }
            });
        });

        async function loadDataSilent() {
            try {
                const response = await fetch(`https://api.github.com/repos/${myRepo}/contents/data.json`, {
                    headers: { 'Authorization': `token ${GIT_TOKEN}` }
                });
                if(response.ok) {
                    const data = await response.json();
                    const decodedData = decodeURIComponent(escape(atob(data.content)));
                    const netArray = JSON.parse(decodedData);
                    if(netArray && netArray.length > 0) {
                        fraudArray = netArray;
                        localStorage.setItem('cachedScammerArray', JSON.stringify(fraudArray));
                        autoSuggestSNo();
                    }
                }
            } catch (error) {
                console.log("Offline mode active, using local cache.");
            }
        }

        async function loadData() {
            const loginBtn = document.querySelector('#loginSection .btn-green');
            loginBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> CONNECTING...";

            try {
                const response = await fetch(`https://api.github.com/repos/${myRepo}/contents/data.json`, {
                    headers: { 'Authorization': `token ${GIT_TOKEN}` }
                });
                
                if(response.ok) {
                    const data = await response.json();
                    const decodedData = decodeURIComponent(escape(atob(data.content)));
                    const netArray = JSON.parse(decodedData);
                    if(netArray && netArray.length > 0) {
                        fraudArray = netArray;
                    }
                }
            } catch (error) {
                console.log("Using cached data due to offline state.");
            }
            
            if(fraudArray.length === 0) {
                fraudArray = JSON.parse(localStorage.getItem('cachedScammerArray') || '[]');
            }

            localStorage.setItem('isScammerAdminLoggedIn', 'true');
            localStorage.setItem('cachedScammerArray', JSON.stringify(fraudArray));
            
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('editorSection').style.display = 'block';
            autoSuggestSNo();
        }

        function logoutAdmin() {
            localStorage.removeItem('isScammerAdminLoggedIn');
            document.getElementById('editorSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
            document.querySelector('#loginSection .btn-green').innerHTML = "<i class='fa-solid fa-right-to-bracket'></i> ENTER ADMIN PANEL";
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if(file) {
                processImageFile(file);
            }
        }

        function processImageFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                base64Image = e.target.result;
                document.getElementById('imageUrlInput').value = base64Image;
                const preview = document.getElementById('imagePreview');
                preview.src = base64Image;
                preview.style.display = 'inline-block';
                document.getElementById('uploadText').innerText = "Image Loaded Successfully ✅";
            }
            reader.readAsDataURL(file);
        }

        function autoSuggestSNo() {
            if(fraudArray.length > 0) {
                const maxNo = Math.max(...fraudArray.map(item => parseInt(item.s_no) || 0));
                document.getElementById('sNoInput').value = maxNo + 1;
            } else {
                document.getElementById('sNoInput').value = 1;
            }
        }

        function processFraudEntry() {
            const s_no = document.getElementById('sNoInput').value.trim();
            const whatsapp = document.getElementById('whatsappInput').value.trim();
            const image = document.getElementById('imageUrlInput').value.trim();
            
            if(!s_no || !whatsapp || !image) { 
                return; 
            }

            const actionBtn = document.getElementById('actionBtn');

            if(editIndex === null) {
                fraudArray.push({ s_no, image, whatsapp });
            } else {
                fraudArray[editIndex] = { s_no, image, whatsapp };
                editIndex = null;
                document.getElementById('formTitle').innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> Add New Scammer Entry";
                document.getElementById('actionBtn').className = "btn-pro btn-green";
            }

            // Reset form fields
            document.getElementById('whatsappInput').value = "";
            document.getElementById('imageUrlInput').value = "";
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('imageInput').value = "";
            document.getElementById('uploadText').innerText = "Click to browse OR Paste Screenshot (Ctrl + V)";
            base64Image = "";

            localStorage.setItem('cachedScammerArray', JSON.stringify(fraudArray));
            autoSuggestSNo();

            actionBtn.innerHTML = "<i class='fa-solid fa-circle-check'></i> ADDED LOCALLY ✅";
            actionBtn.style.background = "#00ea77";
            actionBtn.style.color = "#000";

            setTimeout(() => {
                actionBtn.innerHTML = "<i class='fa-solid fa-plus'></i> ADD ENTRY";
                actionBtn.style.background = "#00ea77";
                actionBtn.style.color = "#000";
            }, 2000);
        }

        function renderFraudList() {
            const container = document.getElementById('fraudListContainer');
            container.innerHTML = "";
            
            // Local storage aur array se latest data load karo taaki list kabhi empty na dikhe
            fraudArray = JSON.parse(localStorage.getItem('cachedScammerArray') || JSON.stringify(fraudArray));

            if (!fraudArray || fraudArray.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #8b949e; padding: 30px;">No records found.</div>';
                return;
            }

            fraudArray.forEach((item, index) => {
                container.innerHTML += `
                    <div class="list-item">
                        <div style="display: flex; align-items: center; flex: 1; padding-right: 15px; overflow: hidden;">
                            <img src="${item.image}" class="icon-preview" alt="Img">
                            <div>
                                <strong style="color: #00ea77; font-size: 14px;">#S_NO. ${item.s_no}</strong>
                                <div style="font-size: 12px; color: #8b949e; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 250px;">${item.whatsapp}</div>
                            </div>
                        </div>
                        <div class="action-btns">
                            <button class="btn-edit" onclick="editFraud(${index})"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-delete" onclick="deleteFraud(${index})"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>`;
            });
        }

        function editFraud(index) {
            editIndex = index;
            const item = fraudArray[index];
            document.getElementById('sNoInput').value = item.s_no || "";
            document.getElementById('whatsappInput').value = item.whatsapp || "";
            document.getElementById('imageUrlInput').value = item.image || "";
            
            const preview = document.getElementById('imagePreview');
            preview.src = item.image;
            preview.style.display = 'inline-block';
            document.getElementById('uploadText').innerText = "Image Loaded ✅";
            base64Image = item.image;
            
            document.getElementById('formTitle').innerHTML = `<i class='fa-solid fa-pen-to-square'></i> Edit Entry #${item.s_no}`;
            document.getElementById('actionBtn').innerHTML = "<i class='fa-solid fa-check-double'></i> UPDATE ENTRY";
            document.getElementById('actionBtn').className = "btn-pro btn-yellow";
            closeModal(); 
        }

        function deleteFraud(index) {
            fraudArray.splice(index, 1);
            localStorage.setItem('cachedScammerArray', JSON.stringify(fraudArray));
            renderFraudList();
            autoSuggestSNo();
        }

        async function saveToGitHub() {
            const uploadBtn = document.querySelector('.btn-blue');
            uploadBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> UPLOADING...";
            uploadBtn.style.background = "#d29922";

            try {
                let currentSha = "";
                const getRes = await fetch(`https://api.github.com/repos/${myRepo}/contents/data.json`, {
                    headers: { 'Authorization': `token ${GIT_TOKEN}` }
                });
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    currentSha = fileData.sha;
                }

                const updatedJson = JSON.stringify(fraudArray, null, 2);
                const encodedContent = btoa(unescape(encodeURIComponent(updatedJson)));

                const response = await fetch(`https://api.github.com/repos/${myRepo}/contents/data.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${GIT_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: "Update scammer list via Admin Panel", 
                        content: encodedContent, 
                        sha: currentSha ? currentSha : undefined 
                    })
                });

                if(response.ok) {
                    uploadBtn.innerHTML = "<i class='fa-solid fa-circle-check'></i> UPLOAD DONE ✅";
                    uploadBtn.style.background = "#00ea77";
                    uploadBtn.style.color = "#000";

                    setTimeout(() => {
                        uploadBtn.innerHTML = "<i class='fa-solid fa-cloud-arrow-up'></i> UPLOAD TO GITHUB";
                        uploadBtn.style.background = "#1f6feb";
                        uploadBtn.style.color = "#fff";
                    }, 3000);

                } else { 
                    throw new Error("Upload failed"); 
                }
            } catch (error) {
                uploadBtn.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> FAILED ❌";
                uploadBtn.style.background = "#da3633";
                setTimeout(() => {
                    uploadBtn.innerHTML = "<i class='fa-solid fa-cloud-arrow-up'></i> UPLOAD TO GITHUB";
                    uploadBtn.style.background = "#1f6feb";
                }, 3000);
            }
        }

        function openModal() { document.getElementById('listModal').style.display = 'flex'; renderFraudList(); }
        closeModal = function() { document.getElementById('listModal').style.display = 'none'; }
    </script>
</body>
</html>
